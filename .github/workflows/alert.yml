name: Ransomware Alert Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ransomware-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run monitor
        env:
          COUNTRY: ${{ vars.COUNTRY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python uae_ransomware_alert.py
      - name: Commit state
        run: |
          if [ -f seen_victims.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_victims.json
            git diff --staged --quiet || (git commit -m "Update seen victims [skip ci]" && git push)
          fi
